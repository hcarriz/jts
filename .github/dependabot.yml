version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: gomod
    directory: /tools
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      tools-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
